name: Evaluation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Run single turn evaluation
        id: single_turn_evaluation
        shell: bash
        run: |
          set -o pipefail

          uv run python -m evals.run_eval | tee single_eval_output.txt

          experiment_name=$(grep '^EXPERIMENT_NAME=' single_eval_output.txt | cut -d '=' -f2-)

          echo "Experiment: $experiment_name"

          echo "EXPERIMENT_NAME=$experiment_name" >> "$GITHUB_ENV"

      - name: Run multi-turn evaluation
        id: multi_turn_evaluation
        shell: bash
        run: |
          set -o pipefail

          uv run python -m evals.run_multiturn_eval | tee multiturn_eval_output.txt

          multiturn_experiment_name=$(grep '^MULTITURN_EXPERIMENT_NAME=' multiturn_eval_output.txt | cut -d '=' -f2-)

          echo "MultiTurnExperiment: $multiturn_experiment_name"

          echo "MULTITURN_EXPERIMENT_NAME=$multiturn_experiment_name" >> "$GITHUB_ENV"

      - name: Run single-turn regression gate
        id: single_turn_gate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          uv run python -m evals.analyze_eval | tee single_regression_output.txt

      - name: Run multi-turn regression gate
        id: multi_turn_gate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          uv run python -m evals.analyze_multiturn_eval | tee multiturn_regression_output.txt

      - name: Post evaluation results to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            const singleTurnOutput = fs.existsSync("single_regression_output.txt")
              ? fs.readFileSync("single_regression_output.txt", "utf8")
              : "No single-turn regression output found.";

            const multiTurnOutput = fs.existsSync("multiturn_regression_output.txt")
              ? fs.readFileSync("multiturn_regression_output.txt", "utf8")
              : "No multi-turn regression output found.";

            const singleTurnStatus =
              "${{ steps.single_turn_gate.outcome }}" === "success"
                ? "✅ PASSED"
                : "❌ FAILED";

            const multiTurnStatus =
              "${{ steps.multi_turn_gate.outcome }}" === "success"
                ? "✅ PASSED"
                : "❌ FAILED";

            const body = `## 🤖 AI Evaluation Report

            ### Single-turn evaluation
            **Status:** ${singleTurnStatus}

            \`\`\`
            ${singleTurnOutput}
            \`\`\`

            ### Multi-turn evaluation
            **Status:** ${multiTurnStatus}

            \`\`\`
            ${multiTurnOutput}
            \`\`\`

            ---
            *Generated automatically by GitHub Actions.*
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

env:
  LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
  LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
  LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
  LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
